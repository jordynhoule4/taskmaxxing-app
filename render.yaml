services:
  - type: web
    name: taskmaxxing-app
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: taskmaxxing-db
          property: connectionString
    healthCheckPath: /

databases:
  - name: taskmaxxing-db
    databaseName: taskmaxxing
    user: taskmaxxing